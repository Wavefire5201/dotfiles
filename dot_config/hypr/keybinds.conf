###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

$terminal = kitty
$fileManager = dolphin
$menu = rofi
$lock = hyprlock

$mainMod = SUPER
$screenshotDir = ~/Pictures/Screenshots/

bind = $mainMod, return, exec, $terminal
bind = $mainMod, Q, exec, ~/.config/hypr/scripts/toggle_kitty.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/toggle_notes.sh   # raycast-style notes popup
bind = $mainMod, C, killactive
# bind = $mainMod, M, exit
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, T, togglefloating
bind = $mainMod SHIFT, P, pin                  # pin floating window across all workspaces
bind = $mainMod ALT, C, centerwindow           # center the current floating window
bind = $mainMod SHIFT, F, fullscreenstate, 0 2 # fake fullscreen (keeps waybar visible)
bind = $mainMod, F, fullscreen
bind = $mainMod, V, exec, pgrep clipse >/dev/null 2>&1 && killall clipse || $terminal --class clipse -e 'clipse'
bind = $mainMod, period, exec, $menu -show emoji
# bind = $mainMod, space, exec, pgrep rofi >/dev/null 2>&1 && killall rofi || $menu -show drun # This toggles rofi
bind = $mainMod, space, exec, vicinae toggle
bind = $mainMod ALT, space, exec, ~/.config/hypr/scripts/menu.sh   # central command menu (omarchy-style)
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, O, layoutmsg, togglesplit # dwindle
bind = $mainMod, escape, exec, $lock
bind = $mainMod, N, exec, swaync-client -t -sw
# Screenshots & screen tools (scripts/screenshot.sh)
bind = control_l&alt_l, S, exec, ~/.config/hypr/scripts/screenshot.sh copy           # quick region -> clipboard (muscle memory)
bind = control_l&shift_l&alt_l, S, exec, ~/.config/hypr/scripts/screenshot.sh region # region -> annotate -> save+copy
bind = control_l&shift_l&alt_l, A, exec, ~/.config/hypr/scripts/screenshot.sh output # whole screen -> save+copy
bind = $mainMod ALT, S, exec, ~/.config/hypr/scripts/screenshot-menu.sh              # full menu: window/ocr/colour/pin/browse
bind = $mainMod, Y, exec, emacs

# Move focus with mainMod + arrow keys
bind = $mainMod, h, movefocus, l
bind = $mainMod, j, movefocus, d
bind = $mainMod, k, movefocus, u
bind = $mainMod, l, movefocus, r

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Switch workspaces with left and right
bind = $mainMod CTRL, left, workspace, r-1
bind = $mainMod CTRL, right, workspace, r+1

# Move active window to left or right workspace
bind = $mainMod SHIFT, left, movetoworkspace, r-1
bind = $mainMod SHIFT, right, movetoworkspace, r+1

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness (routed through swayosd for on-screen overlay)
bindel = ,XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = ,XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindel = ,XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindel = ,XF86AudioMicMute, exec, swayosd-client --input-volume mute-toggle
bindel = ,XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = ,XF86MonBrightnessDown, exec, swayosd-client --brightness lower
# keyboard backlight stays on brightnessctl (swayosd targets the display backlight)
bindel = ,XF86KbdBrightnessUp, exec, brightnessctl -d asus::kbd_backlight set +1
bindel = ,XF86KbdBrightnessDown, exec, brightnessctl -d asus::kbd_backlight set 1-
